# Cloudflare Pages project config (static site + Pages Functions in /functions)
name = "song-of-the-week"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "sotw-comments"
database_id = "cd631e70-f089-4e55-82d7-305c0f2a4e4a"
migrations_dir = "migrations"

[vars]
# Cloudflare Access (Zero Trust) settings for the /admin routes
ACCESS_TEAM_DOMAIN = "REPLACE_ME.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_APPLICATION_AUD_TAG"

# Secrets (set with `wrangler pages secret put <NAME>`, and in .dev.vars locally):
#   TURNSTILE_SECRET
#   IP_SALT
